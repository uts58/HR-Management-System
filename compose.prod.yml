# Production override. Use it together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d
#
# - Caddy terminates TLS (automatic Let's Encrypt) and is the only service
#   with published ports (80/443).
# - The web port is unpublished, so it is reachable only on the internal
#   network. db never publishes a port.
# - Caddy overwrites X-Forwarded-For with the real client IP
#   (docker/caddy/Caddyfile).
#
# Required env (host .env, root-only): APP_DOMAIN, plus everything
# docker-compose.yml needs.

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set, e.g. hr.example.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    ports: !reset []
    environment:
      BETTER_AUTH_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}

volumes:
  caddy_data:
  caddy_config:
