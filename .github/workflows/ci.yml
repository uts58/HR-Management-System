name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Same as the containers: server-side dates are always UTC.
  TZ: UTC

jobs:
  # -------------------------------------------------------------------------
  web-quality:
    name: web / lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  # -------------------------------------------------------------------------
  web-build:
    name: web / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: next build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"

  # -------------------------------------------------------------------------
  web-integration:
    name: web / integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hruser
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hr_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hruser -d hr_web_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hruser:ci_password@localhost:5432/hr_web_test
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - run: npm run test:integration

  # -------------------------------------------------------------------------
  web-e2e:
    name: web / e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hruser
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hr_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hruser -d hr_web_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The DB name must end in _test or _it: QA's reset refuses anything else.
      DATABASE_URL: postgresql://hruser:ci_password@localhost:5432/hr_web_test
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      # ONE canonical origin. playwright.config.ts derives baseURL and the
      # standalone server's HOSTNAME from this value. Better Auth's
      # trustedOrigins is [BETTER_AUTH_URL] (src/auth/config.ts), so a
      # localhost vs 127.0.0.1 mismatch would 403 the login.
      BETTER_AUTH_URL: http://127.0.0.1:3000
      # Switch for the @backend-tagged specs (tests/support/env.ts). Leave it
      # OFF until Frontend's real-service wiring is on main; the director
      # will say when. To enable, set it to "1".
      E2E_BACKEND: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Detect e2e tests
        id: detect
        shell: bash
        run: |
          if [ -d tests/e2e ] && find tests/e2e -name '*.spec.ts' -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            # Make the skip impossible to miss: a green job here means
            # "nothing ran", not "e2e passed".
            echo "::notice title=web e2e SKIPPED::No Playwright specs (*.spec.ts) in web/tests/e2e. The e2e suite did NOT run; this green job is a skip, not a pass."
            {
              echo "## web / e2e: SKIPPED"
              echo
              echo "No \`*.spec.ts\` files under \`web/tests/e2e\`, so Playwright did **not** run."
              echo "This job is green because it was skipped, not because e2e tests passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.has_tests == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.detect.outputs.has_tests == 'true'
        run: npm ci
      - name: Playwright version
        id: pw
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          # Runner image (e.g. ubuntu26) so caches never cross OS releases.
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.detect.outputs.has_tests == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ steps.pw.outputs.image }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium OS dependencies
        if: steps.detect.outputs.has_tests == 'true'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fail instead of waiting forever on a dpkg lock or a slow mirror.
          printf '%s\n' 'DPkg::Lock::Timeout "300";' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          # Run as root ourselves: Playwright's own `sudo` would drop
          # DEBIAN_FRONTEND.
          sudo env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive ./node_modules/.bin/playwright install-deps chromium
      - name: Install Chromium
        if: steps.detect.outputs.has_tests == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          DEBUG: pw:install
        run: npx playwright install chromium
      - if: steps.detect.outputs.has_tests == 'true'
        run: npx prisma migrate deploy
      - if: steps.detect.outputs.has_tests == 'true'
        run: npm run build
      # playwright.config.ts starts `node .next/standalone/server.js` in CI
      # (after scripts/prepare-standalone.mjs copies public/ and .next/static).
      - if: steps.detect.outputs.has_tests == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure() && steps.detect.outputs.has_tests == 'true'
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # -------------------------------------------------------------------------
  web-docker:
    name: web / docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runner image
        uses: docker/build-push-action@v7
        with:
          context: web
          target: runner
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build migrator image
        uses: docker/build-push-action@v7
        with:
          context: web
          target: migrator
          push: false
          # Separate scope: a shared scope would make each build overwrite the
          # other's cache manifest.
          cache-from: |
            type=gha,scope=web-migrator
            type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web-migrator

  # -------------------------------------------------------------------------
  legacy:
    name: legacy / install + syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Current Node LTS: same as web/ and the legacy Dockerfile (node:26).
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # Installs Security's hardening deps (helmet, csrf-sync, connect-pg-simple,
      # @node-rs/bcrypt, ...). Native prebuilt binaries are fetched for linux-x64.
      - run: npm ci
      - name: node --check on legacy server code
        shell: bash
        # Server-side code only. legacy-tests/ (QA, TypeScript/Playwright) has
        # its own package.json, and public/js is browser code.
        run: |
          find app.js lib routes prisma -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Generate Prisma client (as the legacy Dockerfile does)
        run: npx prisma generate
      - name: Load the app modules (catches missing deps)
        # Requires every legacy module once without starting the server, so a
        # dependency that is missing from package.json fails CI.
        run: |
          node -e "for (const m of ['./lib/auth','./lib/password','./lib/session','./lib/prisma']) require(m); console.log('modules ok')"

  # -------------------------------------------------------------------------
  # QA's parity suite (legacy-tests/) against the hardened legacy app.
  # See docs/qa/test-strategy.md sections 6 and 7. Known open defects are
  # `test.fail` (expected failures), so a green run means 57 pass and
  # 3 fail as expected. A defect that starts passing fails the run on purpose.
  legacy-e2e:
    name: legacy / e2e (Playwright parity suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hruser
          POSTGRES_PASSWORD: qa_pass
          POSTGRES_DB: hrdb_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hruser -d hrdb_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hruser:qa_pass@localhost:5432/hrdb_qa
      BASE_URL: http://localhost:3100
      # Playwright starts `node app.js` itself (legacy-tests/playwright.config.ts)
      # with TRUST_PROXY=1 and BCRYPT_ROUNDS=4. Each test context sends its own
      # X-Forwarded-For, so the login rate limit applies per test.
      START_LEGACY: "1"
      SESSION_SECRET: ci-only-legacy-tests-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            legacy-tests/package-lock.json
      - name: Install legacy app
        run: npm ci
      - name: Create legacy schema
        run: npx prisma db push
      - name: Create session table
        run: npm run db:session-table
      - name: Install suite
        working-directory: legacy-tests
        run: npm ci
      - name: Playwright version
        id: pw
        working-directory: legacy-tests
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          # Runner image (e.g. ubuntu26) so caches never cross OS releases.
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ steps.pw.outputs.image }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium OS dependencies
        working-directory: legacy-tests
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Fail instead of waiting forever on a dpkg lock or a slow mirror.
          printf '%s\n' 'DPkg::Lock::Timeout "300";' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          # Run as root ourselves: Playwright's own `sudo` would drop
          # DEBIAN_FRONTEND.
          sudo env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive ./node_modules/.bin/playwright install-deps chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: legacy-tests
        timeout-minutes: 10
        env:
          DEBUG: pw:install
        run: npx playwright install chromium
      - name: Run suite
        # globalSetup resets the DB from legacy-tests/fixtures/seed.sql first.
        working-directory: legacy-tests
        timeout-minutes: 10
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: legacy-playwright-report
          path: |
            legacy-tests/playwright-report
            legacy-tests/test-results
          retention-days: 7
