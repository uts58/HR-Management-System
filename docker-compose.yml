# Production-like stack:
#   docker compose up -d --build
#
# One Postgres server and one database (${WEB_DB_NAME:-hr_web}) owned by a
# NOSUPERUSER role (${WEB_DB_USER:-hr_web_app}). db-init creates the role and
# database; the superuser credentials (DB_USER / DB_PASS) are used only there.
# Needs DB_PASS, WEB_DB_PASS and BETTER_AUTH_SECRET (see .env.example). Use
# URL-safe passwords, e.g. `openssl rand -hex 24`, because they are embedded
# in DATABASE_URL.
# Web containers run with TZ=UTC. There is no company time zone: timestamps
# are stored in UTC and rendered in each viewer's browser zone.
#
# Production: add compose.prod.yml (Caddy TLS proxy, no published app/db ports).
#
# Start order: db (healthy) -> db-init (exits 0) -> web-migrate (exits 0) -> web
# For local development with `npm run dev` use compose.dev.yml instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       postgres
      POSTGRES_USER:     ${DB_USER:-hruser}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hruser} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Creates or updates the web role and database. Idempotent, and safe on an
  # existing volume, where initdb scripts never run.
  db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-hruser}
      PGPASSWORD: ${DB_PASS}
      PGDATABASE: postgres
      WEB_DB_USER: ${WEB_DB_USER:-hr_web_app}
      WEB_DB_PASS: ${WEB_DB_PASS:-}
      WEB_DB_NAMES: ${WEB_DB_NAME:-hr_web}
      WEB_DB_CREATEDB: "0"
    volumes:
      - ./docker/postgres/create-web-dbs.sh:/scripts/create-web-dbs.sh:ro
    command: ["sh", "/scripts/create-web-dbs.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Applies Prisma migrations (`prisma migrate deploy`) then exits.
  web-migrate:
    build:
      context: ./web
      target: migrator
    image: hr-web-migrate:latest
    environment:
      DATABASE_URL: postgresql://${WEB_DB_USER:-hr_web_app}:${WEB_DB_PASS:-}@db:5432/${WEB_DB_NAME:-hr_web}
      TZ: UTC
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: ./web
      target: runner
    image: hr-web:latest
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${WEB_DB_USER:-hr_web_app}:${WEB_DB_PASS:-}@db:5432/${WEB_DB_NAME:-hr_web}
      # The app refuses to boot if these are missing or invalid (src/env.ts).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      # Fixed, not configurable: server-side dates are always UTC (also set
      # in web/Dockerfile).
      TZ: UTC
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # Next.js writes ISR / image-optimisation cache here.
      - /app/.next/cache:uid=1001,gid=1001

volumes:
  db_data:
